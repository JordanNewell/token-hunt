# ---- generic fallbacks (unattributed shapes shared by several providers) ----

[[rules]]
id = "generic-sk-key"
description = "Unattributed sk- 32-char key (DeepSeek / StepFun / Moonshot / SiliconFlow / Poe / Qwen shape)"
regex = '''(?<![A-Za-z0-9])sk-[a-z0-9]{32}(?![A-Za-z0-9])'''
keywords = []
rotate_url = ""

[[rules]]
id = "generic-jwt"
description = "Generic JWT (MiniMax / DeepInfra scoped / Crusoe CLI bearer)"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{5,}'''
keywords = []
rotate_url = ""

[allowlist]
description = "Skip test fixtures and example files"
paths = [
    '''(^|/)node_modules/.*''',
    '''(^|/)vendor/.*''',
    '''(^|/)tests?/fixtures?/.*''',
    '''(^|/)tests?/.*\.example$''',
    '''.*\.example$''',
    '''.*\.env\.sample$''',
    '''.*\.env\.example$''',
]
