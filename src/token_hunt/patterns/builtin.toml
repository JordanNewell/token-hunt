regex = '''[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
keywords = ["scaleway"]
rotate_url = "https://console.scaleway.com/organization/credentials"

# ---- keyword-gated opaque keys (no provider-documented shape).
# Fires only when the provider name appears in the scanned text AND a 32+-char
# alphanumeric token is present. Low-precision by design — value is attribution
# + rotation URL, not shape confidence. Same pattern as mistral/cohere above.

[[rules]]
id = "sambanova-key"
description = "SambaNova API key (keyword-gated opaque)"
regex = '''(?<![A-Za-z0-9])[A-Za-z0-9]{32,}(?![A-Za-z0-9])'''
keywords = ["sambanova"]
rotate_url = "https://cloud.sambanova.ai/apis"

